name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: naver
        type: choice
        options:
          - aws
          - naver
          - both

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bubli-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/bubli-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'aws' || inputs.target == 'both')) ||
        (github.event_name == 'workflow_run' && (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == 'both'))
      )

    steps:
      - name: Deploy backend to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_SERVER_URL: ${{ secrets.LIVEKIT_SERVER_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LETSENCRYPT_EMAIL: myksphone2001@gmail.com
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_IMAGE_TAG,DOCKER_USERNAME,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,LIVEKIT_SERVER_URL,SENTRY_DSN,LETSENCRYPT_EMAIL
          script: |
            set -e
            cd ~/bubli-backend
            git fetch origin ${{ github.event.workflow_run.head_sha || github.sha }}
            git checkout --detach ${{ github.event.workflow_run.head_sha || github.sha }}
            ./scripts/render-aws-env.sh
            docker compose --env-file .env.aws -f docker-compose.prod.yml -f docker-compose.aws.yml --profile observability pull
            docker compose --env-file .env.aws -f docker-compose.prod.yml -f docker-compose.aws.yml --profile observability up -d --no-build --force-recreate
            if ! docker exec bubli-certbot test -f /etc/letsencrypt/live/my-bubli.kro.kr/fullchain.pem; then
              docker exec bubli-certbot certbot certonly --webroot --webroot-path /var/www/certbot --email "$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email --non-interactive --keep-until-expiring --domain my-bubli.kro.kr
              ./scripts/render-aws-env.sh
              docker compose --env-file .env.aws -f docker-compose.prod.yml -f docker-compose.aws.yml up -d --no-build --force-recreate nginx
            fi
            docker image prune -f

  deploy-naver:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      needs.build-and-push.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'naver' || inputs.target == 'both')) ||
        (github.event_name == 'workflow_run' && (vars.DEPLOY_TARGET == 'naver' || vars.DEPLOY_TARGET == 'both'))
      )

    steps:
      - name: Deploy stack to Naver Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.NAVER_HOST || '101.79.29.236' }}
          username: ${{ vars.NAVER_SSH_USERNAME || 'deploy' }}
          key: ${{ secrets.NAVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ vars.NAVER_DEPLOY_PATH || '/home/deploy/bubli-backend' }}
            git fetch origin ${{ github.event.workflow_run.head_sha || github.sha }}
            git checkout --detach ${{ github.event.workflow_run.head_sha || github.sha }}
            export IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}
            docker compose --env-file .env.naver -f docker-compose.prod.yml -f docker-compose.naver.yml pull
            docker compose --env-file .env.naver -f docker-compose.prod.yml -f docker-compose.naver.yml up -d --no-build --remove-orphans
            docker image prune -f
