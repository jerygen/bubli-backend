spring:
  config:
    activate:
      on-profile: test

  ai:
    model:
      chat: none
      embedding: none
    vectorstore:
      type: none

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

storage:
  type: local
  local:
    base-path: ./build/test-storage

agent:
  dispatch:
    adapter: in-memory
